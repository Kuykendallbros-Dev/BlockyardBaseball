# nginx configuration for hosting Blockyard Baseball on sloppycards.com.
#
# Add these two location blocks to the existing HTTPS server block for
# sloppycards.com (the Next.js site, nginx/1.24.0 on 159.65.163.216). They sit
# alongside the existing site — nothing about the Next.js app changes, because
# both blocks are scoped to the /games/sloppycardsports/blockyardbaseball
# prefix and nginx prefers the longest matching prefix.
#
# WHY THE WEBSOCKET IS PROXIED THROUGH THIS BOX
# The match server runs on a separate droplet (104.236.66.46:8080) over plain
# ws://. A browser on an HTTPS page refuses a plain ws:// connection as mixed
# content, which is what blocked online play. Proxying it through this host
# means the browser only ever sees wss:// to sloppycards.com, reusing this
# site's existing certificate. No second domain, no second certificate, no DNS
# record, and no new inbound port on the API droplet.
#
# The client picks this URL up automatically — see src/endpoint.ts, which
# derives wss://<this host><base path>ws whenever the page is HTTPS.

# Required once per nginx config (http context). If the existing config already
# defines this map, do not add it twice.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- inside server { server_name sloppycards.com; listen 443 ssl; ... } ------

# The game's static build. Deploy target for `npm run build` output, built with
#   VITE_BASE_PATH=/games/sloppycardsports/blockyardbaseball/ npm run build
# so the bundle requests its own assets from this prefix.
location /games/sloppycardsports/blockyardbaseball/ {
    alias /srv/blockyardbaseball/dist/;
    try_files $uri $uri/ /games/sloppycardsports/blockyardbaseball/index.html;

    # Hashed asset filenames are safe to cache hard; index.html must not be,
    # or a deploy leaves players on the previous bundle.
    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Visiting the path without the trailing slash should still land in the game.
location = /games/sloppycardsports/blockyardbaseball {
    return 301 /games/sloppycardsports/blockyardbaseball/;
}

# The match server. Must be declared before the static block above is matched
# for this exact path — nginx's longest-prefix rule handles that, since this
# location is more specific.
location = /games/sloppycardsports/blockyardbaseball/ws {
    proxy_pass http://104.236.66.46:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A match is a long-lived socket that sits idle between pitches; nginx's
    # 60s default would drop it mid-game.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
